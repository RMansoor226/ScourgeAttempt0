name: Setup Release

on:
  workflow_dispatch:
    inputs:
      release_file:
        description: "Release definition file"
        required: true
        default: "v0.4.0.yml"
        type: string

permissions:
  contents: write
  issues: write

jobs:
  setup:
    name: Create Release Infrastructure
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install / verify tools
      # ---------------------------------------------------------

      - name: Verify GitHub CLI
        run: gh --version

      - name: Verify Python
        run: python3 --version

      # ---------------------------------------------------------
      # Install PyYAML
      # ---------------------------------------------------------

      - name: Install YAML parser
        run: pip install pyyaml

      # ---------------------------------------------------------
      # Load release definition
      # ---------------------------------------------------------

      - name: Load release configuration
        id: release
        env:
          RELEASE_FILE: automation/releases/${{ inputs.release_file }}
        run: |
          python3 << 'PY'
          import os
          import yaml

          release_file = os.environ["RELEASE_FILE"]

          with open(release_file, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          release = data["release"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f'version={release["version"]}\n')
              out.write(f'name={release["name"]}\n')
              out.write(f'milestone={release["milestone"]}\n')
              out.write(f'release_label={release["release_label"]}\n')

          print(f'Loaded release: {release["version"]}')
          print(f'Name: {release["name"]}')
          print(f'Milestone: {release["milestone"]}')
          PY

      # ---------------------------------------------------------
      # Create standard labels
      # ---------------------------------------------------------

      - name: Create standard labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          gh label create "type/feature" \
            --color "1D76DB" \
            --description "New gameplay or technical feature" \
            --force

          gh label create "type/optimization" \
            --color "5319E7" \
            --description "Performance or scalability work" \
            --force

          gh label create "type/bug" \
            --color "B60205" \
            --description "Bug fix" \
            --force

          gh label create "type/refactor" \
            --color "D4C5F9" \
            --description "Code or architecture refactoring" \
            --force

          gh label create "type/release" \
            --color "0E8A16" \
            --description "Release integration or milestone work" \
            --force

          gh label create "type/design" \
            --color "F9D0C4" \
            --description "Game design or balancing work" \
            --force

      # ---------------------------------------------------------
      # Create priority labels
      # ---------------------------------------------------------

      - name: Create priority labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          gh label create "priority/high" \
            --color "B60205" \
            --description "High priority" \
            --force

          gh label create "priority/medium" \
            --color "FBCA04" \
            --description "Medium priority" \
            --force

          gh label create "priority/low" \
            --color "0E8A16" \
            --description "Low priority" \
            --force

      # ---------------------------------------------------------
      # Create release label
      # ---------------------------------------------------------

      - name: Create release label
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LABEL: ${{ steps.release.outputs.release_label }}
        run: |

          gh label create "$RELEASE_LABEL" \
            --color "C5DEF5" \
            --description "Work belonging to this release" \
            --force

      # ---------------------------------------------------------
      # Create milestone
      # ---------------------------------------------------------

      - name: Create release milestone
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MILESTONE: ${{ steps.release.outputs.milestone }}
        run: |

          EXISTING_ID=$(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"$MILESTONE\") | .number" \
            | head -n 1)

          if [ -n "$EXISTING_ID" ]; then
            echo "Milestone already exists: $MILESTONE"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/milestones" \
              -f title="$MILESTONE" \
              -f description="Development milestone for ${RELEASE_VERSION}."

            echo "Created milestone: $MILESTONE"
          fi

      # ---------------------------------------------------------
      # Create issues
      # ---------------------------------------------------------

      - name: Create release issues
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FILE: automation/releases/${{ inputs.release_file }}
          RELEASE_LABEL: ${{ steps.release.outputs.release_label }}
          MILESTONE: ${{ steps.release.outputs.milestone }}
        run: |

          python3 << 'PY'
          import os
          import subprocess
          import yaml

          release_file = os.environ["RELEASE_FILE"]
          release_label = os.environ["RELEASE_LABEL"]
          milestone = os.environ["MILESTONE"]

          with open(release_file, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          tickets = data["tickets"]

          for ticket in tickets:

              number = ticket["number"]
              title = ticket["title"]
              description = ticket["description"]
              ticket_type = ticket["type"]
              priority = ticket["priority"]
              acceptance = ticket.get("acceptance", [])

              issue_title = f'#{number} — {title}'

              acceptance_text = "\n".join(
                  f"- [ ] {item}" for item in acceptance
              )

              body = f"""## Description

          {description}

          ## Release

          {milestone}

          ## Acceptance Criteria

          {acceptance_text}

          ## Type

          `{ticket_type}`

          ## Priority

          `{priority}`

          ## Development

          Branch:
          `feature/{number}-{title.lower().replace(" ", "-")}`

          This issue should be closed when all acceptance criteria have
          been satisfied and the associated pull request has been merged.
          """

              # Check whether issue already exists.
              result = subprocess.run(
                  [
                      "gh",
                      "issue",
                      "list",
                      "--search",
                      f'"{issue_title}" in:title',
                      "--state",
                      "all",
                      "--json",
                      "title,number",
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              if issue_title in result.stdout:
                  print(f"Issue already exists: {issue_title}")
                  continue

              command = [
                  "gh",
                  "issue",
                  "create",
                  "--title",
                  issue_title,
                  "--body",
                  body,
                  "--label",
                  f"type/{ticket_type}",
                  "--label",
                  f"priority/{priority}",
                  "--label",
                  release_label,
                  "--milestone",
                  milestone,
              ]

              subprocess.run(command, check=True)

              print(f"Created issue: {issue_title}")
          PY

      # ---------------------------------------------------------
      # Create feature branches
      # ---------------------------------------------------------

      - name: Create ticket branches
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FILE: automation/releases/${{ inputs.release_file }}
        run: |

          python3 << 'PY'
          import os
          import re
          import subprocess
          import yaml

          release_file = os.environ["RELEASE_FILE"]

          with open(release_file, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          tickets = data["tickets"]

          # Get the default branch.
          default_branch = subprocess.check_output(
              [
                  "gh",
                  "repo",
                  "view",
                  "--json",
                  "defaultBranchRef",
                  "--jq",
                  ".defaultBranchRef.name",
              ],
              text=True,
          ).strip()

          print(f"Default branch: {default_branch}")

          # Make sure we have current refs.
          subprocess.run(
              ["git", "fetch", "origin"],
              check=True
          )

          for ticket in tickets:

              number = ticket["number"]
              title = ticket["title"]
              ticket_type = ticket["type"]

              slug = title.lower()
              slug = re.sub(r"[^a-z0-9]+", "-", slug)
              slug = slug.strip("-")

              if ticket_type == "release":
                  branch_name = f"release/{data['release']['version']}-integration"
              else:
                  branch_name = f"feature/{number}-{slug}"

              # Check whether branch already exists.
              result = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      "--heads",
                      "origin",
                      branch_name,
                  ],
                  capture_output=True,
                  text=True,
              )

              if result.stdout.strip():
                  print(f"Branch already exists: {branch_name}")
                  continue

              subprocess.run(
                  [
                      "git",
                      "checkout",
                      "-b",
                      branch_name,
                      f"origin/{default_branch}",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      branch_name,
                  ],
                  check=True,
              )

              subprocess.run(
                  ["git", "checkout", default_branch],
                  check=True,
              )

              print(f"Created branch: {branch_name}")
          PY
