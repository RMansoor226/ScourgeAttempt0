name: Setup Release

on:
  workflow_dispatch:
    inputs:
      release_file:
        description: "Release definition file"
        required: true
        default: "v0.4.0.yml"
        type: string

permissions:
  contents: write
  issues: write

jobs:
  setup:
    name: Setup Release Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify GitHub CLI
        run: gh --version

      - name: Verify Python
        run: python3 --version

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Load release configuration
        id: release
        env:
          RELEASE_FILE: automation/releases/${{ inputs.release_file }}
        run: |
          python3 << 'PY'
          import os
          import yaml

          path = os.environ["RELEASE_FILE"]

          if not os.path.exists(path):
              raise FileNotFoundError(f"Missing release file: {path}")

          with open(path, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          release = data["release"]

          for field in [
              "version",
              "name",
              "description",
              "milestone",
              "release_label"
          ]:
              if field not in release:
                  raise ValueError(f"Missing release field: {field}")

          if "tickets" not in data:
              raise ValueError("Missing tickets section.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={release['version']}\n")
              out.write(f"name={release['name']}\n")
              out.write(f"milestone={release['milestone']}\n")
              out.write(f"release_label={release['release_label']}\n")

          print(f"Loaded {release['version']}")
          print(f"Tickets: {len(data['tickets'])}")
          PY

      - name: Create or update standard labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "type/feature" \
            --color "1D76DB" \
            --description "New gameplay or technical feature" \
            --force

          gh label create "type/optimization" \
            --color "5319E7" \
            --description "Performance or scalability work" \
            --force

          gh label create "type/bug" \
            --color "B60205" \
            --description "Bug fix" \
            --force

          gh label create "type/refactor" \
            --color "D4C5F9" \
            --description "Code or architecture refactoring" \
            --force

          gh label create "type/release" \
            --color "0E8A16" \
            --description "Release integration or milestone work" \
            --force

          gh label create "type/design" \
            --color "F9D0C4" \
            --description "Game design or balancing work" \
            --force

          gh label create "priority/high" \
            --color "B60205" \
            --description "High priority work" \
            --force

          gh label create "priority/medium" \
            --color "FBCA04" \
            --description "Medium priority work" \
            --force

          gh label create "priority/low" \
            --color "0E8A16" \
            --description "Low priority work" \
            --force

      - name: Create or update release label
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LABEL: ${{ steps.release.outputs.release_label }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh label create "$RELEASE_LABEL" \
            --color "C5DEF5" \
            --description "Work belonging to release ${RELEASE_VERSION}" \
            --force

      - name: Ensure milestone exists
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ steps.release.outputs.milestone }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          EXISTING_ID=$(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"$MILESTONE\") | .number" \
            | head -n 1)

          if [ -n "$EXISTING_ID" ]; then
            echo "Milestone already exists: $MILESTONE (#$EXISTING_ID)"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/milestones" \
              -f title="$MILESTONE" \
              -f description="Development milestone for ${RELEASE_VERSION}."
          fi

      - name: Synchronize issues and branches
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FILE: automation/releases/${{ inputs.release_file }}
          RELEASE_LABEL: ${{ steps.release.outputs.release_label }}
          MILESTONE: ${{ steps.release.outputs.milestone }}
        run: |
          python3 << 'PY'
          import os
          import re
          import subprocess
          import yaml

          RELEASE_FILE = os.environ["RELEASE_FILE"]
          RELEASE_LABEL = os.environ["RELEASE_LABEL"]
          MILESTONE = os.environ["MILESTONE"]

          BEGIN = "<!-- AUTO-GENERATED: BEGIN -->"
          END = "<!-- AUTO-GENERATED: END -->"

          def run(command):
              return subprocess.run(
                  command,
                  capture_output=True,
                  text=True,
                  check=True
              )

          def slugify(text):
              text = text.lower()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              return text.strip("-")

          def generated_section(ticket, branch):
              acceptance = ticket.get("acceptance", [])

              criteria = "\n".join(
                  f"- [ ] {item}" for item in acceptance
              )

              return f"""{BEGIN}

          ## Description

          {ticket["description"].strip()}

          ## Release

          {MILESTONE}

          ## Acceptance Criteria

          {criteria}

          ## Type

          `{ticket["type"]}`

          ## Priority

          `{ticket["priority"]}`

          ## Development Branch

          `{branch}`

          {END}"""

          def merge_generated(existing, generated):
              existing = existing or ""

              start = existing.find(BEGIN)
              end = existing.find(END)

              if start != -1 and end != -1:
                  end += len(END)

                  return (
                      existing[:start]
                      + generated
                      + existing[end:]
                  )

              if existing.strip():
                  return (
                      existing.rstrip()
                      + "\n\n"
                      + generated
                      + "\n"
                  )

              return generated

          with open(RELEASE_FILE, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          release = data["release"]
          tickets = data["tickets"]

          default_branch = run([
              "gh",
              "repo",
              "view",
              "--json",
              "defaultBranchRef",
              "--jq",
              ".defaultBranchRef.name"
          ]).stdout.strip()

          print(f"Default branch: {default_branch}")

          run(["git", "fetch", "origin", "--prune"])

          for ticket in tickets:

              number = str(ticket["number"])
              title = ticket["title"]
              ticket_type = ticket["type"]
              priority = ticket["priority"]

              slug = slugify(title)

              if ticket_type == "release":
                  branch = (
                      f"release/{release['version']}-integration"
                  )
              else:
                  branch = f"feature/{number}-{slug}"

              generated = generated_section(
                  ticket,
                  branch
              )

              # -------------------------------------------------
              # Retrieve issue by exact number
              # -------------------------------------------------

              issue_result = subprocess.run(
                  [
                      "gh",
                      "issue",
                      "view",
                      number,
                      "--json",
                      "number,title,body,state"
                  ],
                  capture_output=True,
                  text=True
              )

              if issue_result.returncode == 0:

                  issue = yaml.safe_load(
                      issue_result.stdout
                  )

                  existing_body = issue.get("body") or ""

                  new_body = merge_generated(
                      existing_body,
                      generated
                  )

                  print(
                      f"Updating issue #{number}: {title}"
                  )

                  run([
                      "gh",
                      "issue",
                      "edit",
                      number,
                      "--title",
                      f"#{number} — {title}",
                      "--body",
                      new_body,
                      "--add-label",
                      f"type/{ticket_type}",
                      "--add-label",
                      f"priority/{priority}",
                      "--add-label",
                      RELEASE_LABEL,
                      "--milestone",
                      MILESTONE
                  ])

              else:

                  print(
                      f"Creating issue #{number}: {title}"
                  )

                  run([
                      "gh",
                      "issue",
                      "create",
                      "--title",
                      f"#{number} — {title}",
                      "--body",
                      generated,
                      "--label",
                      f"type/{ticket_type}",
                      "--label",
                      f"priority/{priority}",
                      "--label",
                      RELEASE_LABEL,
                      "--milestone",
                      MILESTONE
                  ])

              # -------------------------------------------------
              # Ensure branch exists
              # -------------------------------------------------

              branch_result = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      "--heads",
                      "origin",
                      branch
                  ],
                  capture_output=True,
                  text=True
              )

              if branch_result.stdout.strip():

                  print(
                      f"Branch already exists: {branch}"
                  )

              else:

                  print(
                      f"Creating branch: {branch}"
                  )

                  run([
                      "git",
                      "checkout",
                      "-b",
                      branch,
                      f"origin/{default_branch}"
                  ])

                  run([
                      "git",
                      "push",
                      "origin",
                      branch
                  ])

                  run([
                      "git",
                      "checkout",
                      default_branch
                  ])

          print("Synchronization complete.")
          PY
